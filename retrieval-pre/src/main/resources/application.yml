server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: retrieval-pre
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edupulse}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  ai:
    google:
      genai:
        api-key: ${LLM_API_KEY:}
        chat:
          model: ${LLM_CHAT_MODEL:gemini-3.5-flash-lite}
        embedding:
          api-key: ${LLM_API_KEY:}
          text:
            model: ${LLM_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
        initialize-schema: false

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

app:
  multi-query:
    variants: ${APP_MULTI_QUERY_VARIANTS:3}
    timeout-ms: ${APP_MULTI_QUERY_TIMEOUT_MS:1500}
  acronyms-resource: ${APP_ACRONYMS_RESOURCE:classpath:acronyms.yml}
