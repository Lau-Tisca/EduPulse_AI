server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: ingest-static
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/edupulse}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  ai:
    google:
      genai:
        api-key: ${LLM_API_KEY:}
        chat:
          model: ${LLM_CHAT_MODEL:gemini-3.5-flash-lite}
        embedding:
          api-key: ${LLM_API_KEY:}
          text:
            model: ${LLM_EMBEDDING_MODEL:gemini-embedding-001}
            dimensions: ${EMBEDDING_DIMENSIONS:1536}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: ${EMBEDDING_DIMENSIONS:1536}
        initialize-schema: true

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

app:
  chunk-size: ${APP_CHUNK_SIZE:512}
  chunk-overlap: ${APP_CHUNK_OVERLAP:64}
  static-resources-dir: ${APP_STATIC_RESOURCES_DIR:/app/resources}
